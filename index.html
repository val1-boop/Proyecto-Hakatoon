
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduToken - Cursos disponibles</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="header-left">
        <h1>EduToken</h1>
        <p class="tagline">Aprende, completa retos y gana tokens 💡</p>
    </div>
    <div class="header-right">
        <div id="user-display" class="user-display">Cargando...</div>
        <nav class="header-nav">
            <a href="dashboard.html">Avance</a>
        </nav>
        <button type="button" class="btn-logout" id="logout-btn">Cerrar sesión</button>
    </div>
</header>

  <main>
    <!-- Sección principal -->
    <section id="token-section" class="centered-card">
      <h2>Tu progreso</h2>
      <p>Balance actual: <strong id="balance"></strong></p>
      <p>Sigue aprendiendo para ganar más recompensas 🪙</p>
    </section>

    <!-- Sección de cursos -->
    <section class="courses-section">
      <h2 style="text-align:center; margin-bottom:24px;">🎓 Cursos disponibles</h2>
      <div id="courses-container" class="courses-container"></div>
    </section>
  </main>

  <footer>
    <p>EduToken © 2025 - Potenciando tu aprendizaje con recompensas digitales 🚀</p>
  </footer>

  <!-- Modal para ver info de los cursos -->
  <div id="courseModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="closeModal" class="modal-close">&times;</button>
      <h2 id="modal-title">Título del curso</h2>
      <p id="modal-intro"></p>

      <div id="modal-modules">
        <h3>Módulos incluidos:</h3>
        <ul id="modal-modules-list"></ul>
      </div>

      <div class="modal-actions">
        <button id="modal-close-secondary" class="btn-outline">Cerrar</button>
        <button id="modal-start" class="btn-primary">Iniciar curso</button>
      </div>
    </div>
  </div>

  <script src="js/courses.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const coursesContainer = document.getElementById("courses-container");

      window.courses.forEach(course => {
        const card = document.createElement("div");
        card.className = "course-card";
        card.innerHTML = `
          <h3>${course.title}</h3>
          <p>${course.intro}</p>
          <div class="course-actions">
            <button class="btn-primary" onclick="viewInfo('${course.id}')">Ver info</button>
            <button class="btn-outline" onclick="startCourse('${course.id}')">Iniciar curso</button>
          </div>
        `;
        coursesContainer.appendChild(card);
      });

      document.getElementById("closeModal").onclick = closeModal;
      document.getElementById("modal-close-secondary").onclick = closeModal;
    });

    function viewInfo(courseId) {
      const course = window.courses.find(c => c.id === courseId);
      document.getElementById("modal-title").innerText = course.title;
      document.getElementById("modal-intro").innerText = course.intro;
      document.getElementById("modal-modules-list").innerHTML =
        course.modules.map(m => `<li>${m.title}</li>`).join("");
      document.getElementById("courseModal").setAttribute("aria-hidden", "false");
      document.getElementById("modal-start").onclick = () => startCourse(courseId);
    }

    function closeModal() {
      document.getElementById("courseModal").setAttribute("aria-hidden", "true");
    }

    function startCourse(courseId) {
      localStorage.setItem("selectedCourse", courseId);
      window.location.href = "course.html";
    }
  </script>
  <script>
    // Mostrar nombre del usuario logeado
    document.addEventListener("DOMContentLoaded", function() {
        const userDisplay = document.getElementById("user-display");
        const loggedUser = localStorage.getItem("loggedIn");
        
        if (loggedUser) {
            try {
                const userObj = JSON.parse(loggedUser);
                userDisplay.textContent = userObj.displayName || userObj.id || "Usuario";
            } catch (e) {
                userDisplay.textContent = loggedUser;
            }
        } else {
            userDisplay.textContent = "Invitado";
        }
    });
</script>

<script>
    document.getElementById('logout-btn').addEventListener('click', function() {
        // Guardar progreso
        if (typeof saveData === 'function') saveData();
        
        // Eliminar sesión
        localStorage.removeItem('loggedIn');
        
        // Redirigir
        window.location.href = 'login.html';
    });
</script>
<script>
    // FUNCIÓN PARA ACTUALIZAR Y MOSTRAR LOS TOKENS
    function updateTokenDisplay() {
        const balance = localStorage.getItem('balance') || '0';
        const balanceElement = document.getElementById('balance');
        if (balanceElement) {
            balanceElement.textContent = `${balance} tokens`;
        }
    }

    // ACTUALIZAR TOKENS CUANDO LA PÁGINA CARGA
    document.addEventListener('DOMContentLoaded', function() {
        updateTokenDisplay();
        
        // También actualizar cuando la página gane foco (vuelva de otra pestaña)
        window.addEventListener('focus', updateTokenDisplay);
    });

    // ACTUALIZAR TOKENS CADA 2 SEGUNDOS (por si acaso)
    setInterval(updateTokenDisplay, 2000);
</script>
</body>
</html>
