<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduToken - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="main-header">
    <div class="header-left">
        <h1>EduToken</h1>
        <p class="tagline">Tu progreso y logros</p>
    </div>
    <div class="header-right">
        <div id="user-display" class="user-display">Cargando...</div>
        <nav class="header-nav">
            <a href="index.html">Inicio</a>
        </nav>
<button type="button" class="btn-logout" id="logout-btn">Cerrar sesión</button>
    </div>
</header>

  <main>
    <section id="progress-section">
      <h2>Progreso del Usuario</h2>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <p id="progress-text">Nivel 1 - 0% completado</p>
    </section>

    <section id="achievements">
      <h2>Logros desbloqueados</h2>
      <ul id="achievement-list">
        <li>🌱 Bienvenido a EduToken</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 2025 EduToken | Plataforma educativa descentralizada</p>
  </footer>

  <script src="js/aiAssistant.js"></script>
  <script src="js/app.js"></script>.
  <script>
    // Mostrar nombre del usuario logeado
    document.addEventListener("DOMContentLoaded", function() {
        const userDisplay = document.getElementById("user-display");
        const loggedUser = localStorage.getItem("loggedIn");
        
        if (loggedUser) {
            try {
                const userObj = JSON.parse(loggedUser);
                userDisplay.textContent = userObj.displayName || userObj.id || "Usuario";
            } catch (e) {
                userDisplay.textContent = loggedUser;
            }
        } else {
            userDisplay.textContent = "Invitado";
        }
    });
</script>
<script>
    document.getElementById('logout-btn').addEventListener('click', function() {
        // Guardar progreso
        if (typeof saveData === 'function') saveData();
        
        // Eliminar sesión
        localStorage.removeItem('loggedIn');
        
        // Redirigir
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
