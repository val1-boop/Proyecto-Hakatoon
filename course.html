<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>EduToken - Curso</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .course-container { max-width: 900px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    .course-header { display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; }
    .modules { margin-top:20px; text-align:left; }
    .module { display:flex; justify-content:space-between; align-items:center; padding:12px; border-radius:8px; border:1px solid #E6E9EE; margin-bottom:10px; }
    .module button { background:#3B82F6; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; }
    .back-btn { background:#111827; color:white; padding:8px 12px; border-radius:8px; border:none; cursor:pointer; }
    .token-reward { font-weight:700; color:#FBBF24; }
  </style>
</head>
<body>
  <div class="course-container">
    <div class="course-header">
      <div>
        <h1 id="course-title"></h1>
        <p id="course-intro"></p>
      </div>
      <div style="text-align:right;">
        <p>Balance: <span id="user-balance">0</span> tokens</p>
        <button class="back-btn" id="backDashboard">Regresar al dashboard</button>
      </div>
    </div>

    <div class="modules">
      <h3>Módulos</h3>
      <div id="modules-list"></div>
    </div>
  </div>

  <section id="ai-tutor" class="card" style="margin-top:18px;">
    <h2>AI Tutor</h2>
    <div id="ai-explanation" style="background:#F8FAFF; padding:12px; border-radius:8px; margin-bottom:10px;">
      <strong>Explicación:</strong>
      <p id="ai-expl-text">Selecciona un módulo y pulsa "Abrir AI Tutor" para comenzar.</p>
    </div>
  </section>

  <script src="js/courses.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const courseId = localStorage.getItem("selectedCourse");
      const course = window.courses.find(c => c.id === courseId);

      if (!course) {
        document.getElementById("course-title").innerText = "Curso no encontrado";
        return;
      }

      document.getElementById("course-title").innerText = course.title;
      document.getElementById("course-intro").innerText = course.intro;

      const modulesList = document.getElementById("modules-list");
      modulesList.innerHTML = "";

      course.modules.forEach(module => {
        const div = document.createElement("div");
        div.className = "module";
        div.innerHTML = `
          <span>${module.title} <span class="token-reward">+${module.tokens} tokens</span></span>
          <button onclick="openModule('${module.id}')">Estudiar módulo</button>
        `;
        modulesList.appendChild(div);
      });
    });

    function openModule(moduleId) {
    const courseId = localStorage.getItem("selectedCourse");
    window.location.href = `module.html?course=${courseId}&module=${moduleId}`;
}

    document.getElementById("backDashboard").onclick = () => {
      window.location.href = "index.html";
    };
  </script>
</body>
</html>
